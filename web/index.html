<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Video Human Review</title>
<style>
  :root { --bg:#16171a; --panel:#1f2125; --line:#2e3137; --fg:#e8e6e1; --dim:#8d9099; --acc:#e0533d; --ok:#5fb37a; }
  * { box-sizing: border-box; }
  html, body { margin:0; height:100%; background:var(--bg); color:var(--fg);
    font: 14px/1.5 -apple-system, "PingFang SC", "Microsoft YaHei", "Segoe UI", "Helvetica Neue", sans-serif; }
  button, select, input, textarea { font: inherit; color: inherit; }
  select { background:#2b2e34; border:1px solid var(--line); border-radius:6px; padding:3px 6px; }
  button { background:#2b2e34; border:1px solid var(--line); border-radius:6px; padding:4px 10px; cursor:pointer; }
  button:hover { background:#353941; }
  button.primary { background:var(--acc); border-color:var(--acc); color:#fff; }
  button.on { background:#4a3a36; border-color:var(--acc); }
  kbd { background:#2b2e34; border:1px solid var(--line); border-bottom-width:2px; border-radius:4px; padding:0 5px; font-size:12px; }
  #app { display:grid; grid-template-columns: 230px 1fr 340px; height:100%; }
  #left, #right { background:var(--panel); overflow:auto; }
  #left { border-right:1px solid var(--line); padding:10px; }
  #right { border-left:1px solid var(--line); display:flex; flex-direction:column; }
  #brand { display:flex; align-items:center; gap:6px; margin-bottom:8px; }
  #brand b { flex:1; letter-spacing:.3px; }
  #langBtn { padding:1px 8px; font-size:12px; }
  #filter { width:100%; padding:6px 8px; background:#14151a; border:1px solid var(--line); border-radius:6px; margin-bottom:8px; }
  .vid { padding:6px 8px; border-radius:6px; cursor:pointer; word-break:break-all; font-size:13px; }
  .vid:hover { background:#2a2d33; }
  .vid.sel { background:#3a2c29; outline:1px solid var(--acc); }
  .vid .dir { color:var(--dim); font-size:11px; }
  .vid .cnt { float:right; background:var(--acc); color:#fff; border-radius:9px; padding:0 6px; font-size:11px; }
  #center { display:flex; flex-direction:column; min-width:0; }
  #stage { position:relative; flex:1; background:#000; min-height:0; }
  #stage video { position:absolute; inset:0; width:100%; height:100%; object-fit:contain; }
  #overlay { position:absolute; cursor:crosshair; }
  #stage.idle #overlay { pointer-events:none; }
  #labelInput { position:absolute; display:none; z-index:5; padding:5px 8px; background:rgba(0,0,0,.85); color:#fff; border:2px solid #ff3b30; border-radius:6px; outline:none; }
  #badge { position:absolute; left:12px; top:10px; background:rgba(0,0,0,.65); padding:2px 8px; border-radius:4px; font-variant-numeric:tabular-nums; }
  #empty { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; color:var(--dim); }
  #bar { padding:8px 12px; border-top:1px solid var(--line); background:var(--panel); }
  #timeline { position:relative; height:26px; cursor:pointer; margin-bottom:6px; }
  #track { position:absolute; left:0; right:0; top:11px; height:4px; background:#3a3d44; border-radius:2px; }
  #played { position:absolute; left:0; top:11px; height:4px; background:#c9c6bf; border-radius:2px; }
  #head { position:absolute; top:5px; width:2px; height:16px; background:#fff; }
  .mk { position:absolute; top:2px; width:8px; height:8px; margin-left:-4px; border-radius:50%; background:var(--acc); }
  .mk.done { background:var(--ok); }
  #ctrls { display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
  #ctrls .sp { flex:1; }
  #tc { font-variant-numeric:tabular-nums; min-width:230px; }
  #frameIn { width:64px; padding:1px 6px; background:#14151a; border:1px solid var(--line); border-radius:4px; text-align:center; font-variant-numeric:tabular-nums; }
  #frameIn:focus { border-color:var(--acc); outline:none; }
  .hint { color:var(--dim); font-size:12px; }
  #composer { display:none; padding:10px 12px; border-bottom:1px solid var(--acc); background:#221c1b; }
  #composer.show { display:block; }
  #composer textarea { width:100%; height:110px; background:#14151a; border:1px solid var(--line); border-radius:6px; padding:6px 8px; resize:vertical; }
  #composer .row { display:flex; gap:6px; align-items:center; margin-top:6px; flex-wrap:wrap; }
  .swatch { width:20px; height:20px; border-radius:50%; border:2px solid transparent; cursor:pointer; }
  .swatch.on { border-color:#fff; }
  #rhead { padding:10px 12px; border-bottom:1px solid var(--line); }
  #rhead .path { color:var(--dim); font-size:12px; word-break:break-all; }
  #general { width:100%; height:60px; margin-top:6px; background:#14151a; border:1px solid var(--line); border-radius:6px; padding:6px 8px; resize:vertical; }
  #list { flex:1; overflow:auto; padding:8px; }
  .c { border:1px solid var(--line); border-radius:8px; padding:8px; margin-bottom:8px; background:#24262b; }
  .c.active { border-color:var(--acc); }
  .c.done { opacity:.55; }
  .c .t { font-variant-numeric:tabular-nums; color:#f0a08f; cursor:pointer; }
  .c img { width:100%; border-radius:4px; margin-top:6px; cursor:pointer; display:block; }
  .c .txt { white-space:pre-wrap; margin-top:4px; }
  .c .ops { display:flex; gap:6px; margin-top:6px; align-items:center; }
  .c .ops button { padding:1px 8px; font-size:12px; }
  .vid .cnt.as { background:#b8892f; margin-left:4px; }
  .mk.as { border-radius:1px; background:#e0b04a; top:16px; }
  #tabs { display:flex; border-bottom:1px solid var(--line); }
  #tabs button { flex:1; border:0; border-radius:0; background:transparent; padding:7px 0; color:var(--dim); border-bottom:2px solid transparent; }
  #tabs button.on { color:var(--fg); border-bottom-color:var(--acc); }
  #tabs button.as.on { border-bottom-color:#e0b04a; }
  #acomposer { display:none; padding:10px 12px; border-bottom:1px solid #e0b04a; background:#221f18; }
  #acomposer.show { display:block; }
  #acomposer .row { display:flex; gap:6px; align-items:center; margin-top:6px; flex-wrap:wrap; }
  #acomposer input, #acomposer textarea { width:100%; background:#14151a; border:1px solid var(--line); border-radius:6px; padding:5px 8px; }
  #acomposer textarea { height:60px; resize:vertical; }
  #apreview { width:100%; max-height:160px; object-fit:contain; background:#000; border-radius:4px; margin-top:6px; display:none; }
  .cat { padding:1px 8px; font-size:12px; border-radius:10px; }
  .cat.on { background:#4a3f26; border-color:#e0b04a; }
  .st { font-size:11px; padding:0 6px; border-radius:8px; margin-left:6px; }
  .st.inbox { background:#3a3d44; } .st.candidate { background:#8a5a12; } .st.approved { background:#2f6b45; } .st.rejected { background:#7a2e26; }
  .pair { display:grid; grid-template-columns:1fr 1fr; gap:4px; margin-top:6px; }
  .pair figure { margin:0; } .pair figcaption { font-size:11px; color:var(--dim); }
  .pair img { margin-top:2px !important; background:#000; object-fit:contain; max-height:140px; }
  .c .verdict { font-size:12px; color:var(--dim); margin-top:4px; white-space:pre-wrap; }
  #toast { position:fixed; left:50%; bottom:30px; transform:translateX(-50%); background:#333; padding:6px 14px; border-radius:6px; opacity:0; transition:opacity .2s; pointer-events:none; }
  #toast.show { opacity:1; }
</style>
</head>
<body>
<div id="app">
  <div id="left">
    <div id="brand"><b>Video Human Review</b><button id="langBtn" title="中文 / English"></button></div>
    <input id="filter" data-i18n-ph="search">
    <div id="vids"></div>
  </div>

  <div id="center">
    <div id="stage" class="idle">
      <video id="v" preload="auto" playsinline></video>
      <canvas id="overlay"></canvas>
      <div id="badge" style="display:none"></div>
      <input id="labelInput" autocomplete="off">
      <div id="empty" data-i18n="pickVideo"></div>
    </div>
    <div id="bar">
      <div id="timeline"><div id="track"></div><div id="played"></div><div id="markers"></div><div id="head"></div></div>
      <div id="ctrls">
        <button id="play" data-i18n="play"></button>
        <button id="addBtn" class="primary"><span data-i18n="addNote"></span> <kbd>C</kbd></button>
        <button id="collectBtn"><span data-i18n="collect"></span> <kbd>A</kbd></button>
        <span id="tc"><span id="tcTime">0:00.000</span> · <span data-i18n="framePre"></span><input id="frameIn" value="0" data-i18n-title="frameTip"><span data-i18n="framePost"></span> / <span id="tcDur">0:00.000</span></span>
        <select id="rate">
          <option value="0.25">0.25×</option><option value="0.5">0.5×</option>
          <option value="1" selected>1×</option><option value="1.5">1.5×</option><option value="2">2×</option>
        </select>
        <span class="sp"></span>
        <span class="hint" data-i18n-html="keys"></span>
      </div>
    </div>
  </div>

  <div id="right">
    <div id="rhead">
      <div style="display:flex;align-items:center;gap:8px">
        <b id="vname">—</b><span style="flex:1"></span>
        <button id="copyBtn" data-i18n="copyAI" data-i18n-title="copyTip"></button>
      </div>
      <div class="path" id="rdir"></div>
      <textarea id="general" data-i18n-ph="generalPh"></textarea>
    </div>
    <div id="tabs"><button id="tabNotes" class="on"></button><button id="tabAssets" class="as"></button></div>
    <div id="composer">
      <div class="row" style="margin:0 0 6px">
        <b id="ctime"></b>
        <span class="hint" data-i18n="drawHint"></span>
      </div>
      <div class="row" style="margin:0 0 6px">
        <button data-tool="rect" class="tool on" data-i18n="tRect"></button>
        <button data-tool="arrow" class="tool" data-i18n="tArrow"></button>
        <button data-tool="pen" class="tool" data-i18n="tPen"></button>
        <button data-tool="text" class="tool" data-i18n="tText"></button>
        <span class="swatch on" data-c="#ff3b30" style="background:#ff3b30"></span>
        <span class="swatch" data-c="#ffd60a" style="background:#ffd60a"></span>
        <span class="swatch" data-c="#32d74b" style="background:#32d74b"></span>
        <span class="swatch" data-c="#ffffff" style="background:#ffffff"></span>
        <button id="undo" data-i18n="undo"></button>
      </div>
      <textarea id="ctext" data-i18n-ph="notePh"></textarea>
      <div class="row">
        <button class="primary" id="csave"><span data-i18n="save"></span> <kbd>⌘/Ctrl</kbd><kbd>↵</kbd></button>
        <button id="ccancel"><span data-i18n="cancel"></span> <kbd>Esc</kbd></button>
      </div>
    </div>
    <div id="acomposer">
      <div class="row" style="margin:0 0 4px"><b id="atime"></b><span class="hint" data-i18n="boxHint"></span></div>
      <div class="row" id="cats" style="margin:0 0 6px"></div>
      <input id="aname" data-i18n-ph="namePh" autocomplete="off">
      <textarea id="anote" data-i18n-ph="assetNotePh" style="margin-top:6px"></textarea>
      <img id="apreview">
      <div class="row">
        <button class="primary" id="asave"><span data-i18n="save"></span> <kbd>⌘/Ctrl</kbd><kbd>↵</kbd></button>
        <button id="acancel"><span data-i18n="cancel"></span> <kbd>Esc</kbd></button>
      </div>
    </div>
    <div id="list"></div>
  </div>
</div>
<div id="toast"></div>

<script>
// ---------- i18n ----------
const I18N = {
  en: {
    search: 'Search videos…', pickVideo: '← Pick a video on the left', noVideos: 'No videos found under this folder.',
    play: 'Play', pause: 'Pause', addNote: 'Note this frame',
    framePre: 'frame ', framePost: '', frameTip: 'Type a frame number and press Enter (shortcut G)',
    keys: '<kbd>Space</kbd> play/pause · <kbd>←</kbd><kbd>→</kbd> 1 s · <kbd>,</kbd><kbd>.</kbd> or <kbd>⇧</kbd>+<kbd>←</kbd><kbd>→</kbd> 1 frame · <kbd>G</kbd> go to frame · <kbd>[</kbd><kbd>]</kbd> prev/next note',
    copyAI: 'Copy for AI', copyTip: 'Copy a one-line hand-off message to paste into your AI assistant',
    generalPh: 'Overall notes (not tied to a frame)', savedTo: 'Notes are saved to: ',
    drawHint: 'Draw a box / arrow on the frame, then type a label for it. "Text" puts words anywhere.',
    tRect: 'Box', tArrow: 'Arrow', tPen: 'Pen', tText: 'Text', undo: 'Undo',
    notePh: "What's wrong in this frame, and how should it change?", save: 'Save', cancel: 'Cancel',
    labelPh: 'Label for this mark (Enter to confirm, optional)', textPh: 'Text to put on the frame',
    frameN: f => `frame ${f}`, needContent: 'Write something or draw a mark first', saved: 'Saved',
    empty: 'No notes yet. Pause on a frame and press <kbd>C</kbd>.', fixed: 'Done', edit: 'Edit', del: 'Delete',
    onlyMarks: '(marks only)', confirmDel: n => `Delete note #${n}?`, generalSaved: 'Overall notes saved',
    copied: 'Copied — paste it into your AI chat',
    handoff: p => `I finished reviewing the video. My notes are in ${p} (one screenshot per note in the same folder; numbered marks on each screenshot match the list). Please go through them one by one and fix each issue.`,
    collect: 'Collect asset', tabNotes: n => `Notes ${n}`, tabAssets: n => `Assets ${n}`,
    boxHint: 'Drag a box around what you want to keep', namePh: 'Name it (e.g. "moon over the camp gate")',
    assetNotePh: 'What do you like about it? (optional)', needBox: 'Drag a box on the frame first',
    assetsEmpty: 'No assets yet. Pause on a good frame and press <kbd>A</kbd>, then box what you want to keep.',
    st: { inbox: 'inbox', candidate: 'AI rebuilt it — check', approved: 'approved', rejected: 'rejected' },
    crop: 'Your box', aiRender: 'AI rebuild', pass: 'Approve', fail: 'Reject',
    failWhy: 'What is off? (the AI fixes it from this)', confirmDelA: n => `Delete asset ${n}?`,
    assetsHandoff: (p, n) => `I collected ${n} asset(s) from this video. They are listed in ${p} (each entry has the boxed crop and the clean full frame in the same folder). Please process the entries whose status is "inbox", and redo the "rejected" ones using the reason in their verdict.`,
    cats: { '物件': 'Object', '布景': 'Set', '天和光': 'Sky & light', '特效': 'Effect', '构图镜头': 'Composition', '字': 'Lettering', '人物': 'Figure' },
  },
  zh: {
    search: '搜视频名…', pickVideo: '← 左边选一个视频', noVideos: '这个目录下没有找到视频。',
    play: '播放', pause: '暂停', addNote: '在这帧写意见',
    framePre: '第 ', framePost: ' 帧', frameTip: '输入帧号回车跳转（快捷键 G）',
    keys: '<kbd>空格</kbd> 播放/暂停 · <kbd>←</kbd><kbd>→</kbd> 一秒 · <kbd>,</kbd><kbd>.</kbd> 或 <kbd>⇧</kbd>+<kbd>←</kbd><kbd>→</kbd> 一帧 · <kbd>G</kbd> 输入帧号 · <kbd>[</kbd><kbd>]</kbd> 上/下一条意见',
    copyAI: '复制给 AI', copyTip: '复制一句交接的话，粘贴到和 AI 助手的对话框',
    generalPh: '整体意见（不针对某一帧的，可以写这里）', savedTo: '意见存到：',
    drawHint: '在画面上画框/箭头，画完旁边会弹出输入框写这一处的意见；「文字」点哪写哪',
    tRect: '框', tArrow: '箭头', tPen: '画笔', tText: '文字', undo: '撤销一笔',
    notePh: '这一帧哪里不对、想怎么改……', save: '保存', cancel: '取消',
    labelPh: '给它配一句（回车确定，可不写）', textPh: '写在画面上的字',
    frameN: f => `第 ${f} 帧`, needContent: '写点字或者圈一下再保存', saved: '已保存',
    empty: '还没有意见。暂停在要说的那一帧，按 <kbd>C</kbd>。', fixed: '已改', edit: '改', del: '删',
    onlyMarks: '（只有圈画）', confirmDel: n => `删掉 #${n} 这条意见？`, generalSaved: '整体意见已保存',
    copied: '已复制，去和 AI 的对话框粘贴',
    handoff: p => `审完了，意见在 ${p}，每条的截图在同一个文件夹（截图上的编号和清单对应），请逐条按意见修改。`,
    collect: '收素材', tabNotes: n => `意见 ${n}`, tabAssets: n => `素材 ${n}`,
    boxHint: '在画面上框出想留下的部分', namePh: '起个名字（比如：汉水月夜，月亮压在营门上）',
    assetNotePh: '喜欢它哪里（可不写）', needBox: '先在画面上框一块',
    assetsEmpty: '还没有素材。暂停在好看的那一帧，按 <kbd>A</kbd>，框出想留下的部分。',
    st: { inbox: '待处理', candidate: 'AI 做好了，请审', approved: '已通过', rejected: '不通过' },
    crop: '你框的', aiRender: 'AI 复现', pass: '通过', fail: '不通过',
    failWhy: '差在哪？（AI 按这句改）', confirmDelA: n => `删掉素材 ${n}？`,
    assetsHandoff: (p, n) => `从这个视频收了 ${n} 条素材，清单在 ${p}（每条框出的截图和整帧原图在同一个文件夹），请处理状态是 inbox 的；rejected 的按 verdict 里写的理由重做。`,
    cats: { '物件': '物件', '布景': '布景', '天和光': '天和光', '特效': '特效', '构图镜头': '构图镜头', '字': '字', '人物': '人物' },
  },
};
const qs = new URLSearchParams(location.search);
// language: ?lang=zh|en  >  last choice  >  browser language
let lang = qs.get('lang') || localStorage.getItem('vhr-lang') ||
  ((navigator.language || '').toLowerCase().startsWith('zh') ? 'zh' : 'en');
if (!I18N[lang]) lang = 'en';
const t = (k, ...a) => { const x = (I18N[lang] || I18N.en)[k]; return typeof x === 'function' ? x(...a) : x; };
function applyLang() {
  document.documentElement.lang = lang === 'zh' ? 'zh-CN' : 'en';
  document.querySelectorAll('[data-i18n]').forEach(el => el.textContent = t(el.dataset.i18n));
  document.querySelectorAll('[data-i18n-html]').forEach(el => el.innerHTML = t(el.dataset.i18nHtml));
  document.querySelectorAll('[data-i18n-ph]').forEach(el => el.placeholder = t(el.dataset.i18nPh));
  document.querySelectorAll('[data-i18n-title]').forEach(el => el.title = t(el.dataset.i18nTitle));
  $('#langBtn').textContent = lang === 'zh' ? 'EN' : '中文';
  $('#play').textContent = v.paused ? t('play') : t('pause');
  if (cur) { $('#rdir').textContent = t('savedTo') + info.mdPath; renderList(); }
  renderTabs(); renderCats();
  renderVideos();
}

// ---------- state ----------
const $ = s => document.querySelector(s);
const v = $('#v'), ov = $('#overlay'), octx = ov.getContext('2d'), stage = $('#stage');
let videos = [], cur = null, info = { fps: 30 }, comments = [];
let composing = null; // {id, time, frame, strokes:[], existing}
let tool = 'rect', color = '#ff3b30', drawing = null, activeId = null;
let tab = 'notes', assets = [], assetsInfo = {}, collecting = null; // collecting: {id, time, frame, box, cat, existing}

const fps = () => info.fps || 30;
const frameOf = s => Math.floor(s * fps() + 1e-4);
const fmt = s => { const m = Math.floor(s / 60), r = s - m * 60; return `${m}:${r.toFixed(3).padStart(6, '0')}`; };
const toast = msg => { const el = $('#toast'); el.textContent = msg; el.classList.add('show'); clearTimeout(toast.h); toast.h = setTimeout(() => el.classList.remove('show'), 1800); };
const api = (path, body) => fetch(path, body ? { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ lang, ...body }) } : undefined).then(r => r.json());

$('#langBtn').onclick = async () => {
  lang = lang === 'zh' ? 'en' : 'zh'; localStorage.setItem('vhr-lang', lang); applyLang();
  if (cur && comments.length) await api('/api/lang', { video: cur });  // re-write the Markdown in the new language
};

// ---------- video list ----------
async function loadVideos() {
  const r = await api('/api/videos');
  videos = r.videos; document.title = `Video Human Review · ${r.root}`;
  renderVideos();
}
function renderVideos() {
  const q = $('#filter').value.trim().toLowerCase();
  const box = $('#vids'); box.innerHTML = '';
  if (!videos.length) { box.innerHTML = `<div class="hint">${t('noVideos')}</div>`; return; }
  for (const it of videos) {
    if (q && !it.path.toLowerCase().includes(q)) continue;
    const parts = it.path.split('/');
    const el = document.createElement('div');
    el.className = 'vid' + (cur === it.path ? ' sel' : '');
    const when = new Date(it.mtime * 1000).toLocaleString(lang === 'zh' ? 'zh-CN' : 'en-US', { month: 'numeric', day: 'numeric', hour: '2-digit', minute: '2-digit' });
    el.innerHTML = (it.assets ? `<span class="cnt as">${it.assets}</span>` : '') + (it.comments ? `<span class="cnt">${it.comments}</span>` : '') + '<div class="nm"></div><div class="dir"></div>';
    el.querySelector('.nm').textContent = parts.at(-1);
    el.querySelector('.dir').textContent = (parts.length > 1 ? parts.slice(0, -1).join('/') + ' · ' : '') + when;
    el.onclick = () => openVideo(it.path);
    box.appendChild(el);
  }
}
$('#filter').oninput = renderVideos;

async function openVideo(path, at) {
  if (composing) cancelCompose();
  if (collecting) cancelCollect();
  cur = path; history.replaceState(null, '', location.pathname + location.search + '#v=' + encodeURIComponent(path));
  info = await api('/api/info?v=' + encodeURIComponent(path));
  comments = info.comments || [];
  $('#general').value = info.general || '';
  $('#vname').textContent = path.split('/').at(-1);
  $('#rdir').textContent = t('savedTo') + info.mdPath;
  $('#empty').style.display = 'none'; $('#badge').style.display = '';
  v.src = '/video?v=' + encodeURIComponent(path);
  if (at != null) v.addEventListener('loadedmetadata', () => seek(at), { once: true });
  await loadAssets();

  const a = { id: collecting.id, t: collecting.time, frame: collecting.frame, fps: fps(), box: collecting.box,
    cat: collecting.cat, name: $('#aname').value.trim(), note: $('#anote').value.trim() };
  assetsInfo = await api('/api/asset', { video: cur, asset: a, crop: cropOf(full, collecting.box).toDataURL('image/png'), full: full.toDataURL('image/png') });
  assets = assetsInfo.assets; activeId = a.id;
  cancelCollect(); renderList(); renderMarkers(); bumpAssets();
  toast(t('saved'));
}
$('#asave').onclick = saveCollect;
$('#acancel').onclick = cancelCollect;
$('#collectBtn').onclick = () => startCollect();
for (const id of ['#aname', '#anote']) $(id).addEventListener('keydown', e => {
  if (e.key === 'Enter' && (e.metaKey || e.ctrlKey)) { e.preventDefault(); e.stopPropagation(); saveCollect(); }
  else if (e.key === 'Escape') { e.preventDefault(); e.stopPropagation(); cancelCollect(); }
});
function bumpAssets() { const it = videos.find(x => x.path === cur); if (it) { it.assets = assets.length; renderVideos(); } }
function jumpToAsset(a) {
  if (composing) cancelCompose();
  if (collecting) cancelCollect();
  v.pause(); seek(a.t); activeId = a.id; setTab('assets');
  document.getElementById('a' + a.id)?.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
}
const aimg = f => `/asset?v=${encodeURIComponent(cur)}&f=${encodeURIComponent(f)}&_=${Date.now() % 100000}`;
function renderAssets() {
  const box = $('#list'); box.innerHTML = '';
  if (!cur) return;
  if (!assets.length) { box.innerHTML = `<div class="hint" style="padding:8px">${t('assetsEmpty')}</div>`; return; }
  [...assets].reverse().forEach(a => {
    const el = document.createElement('div');
    el.id = 'a' + a.id;
    el.className = 'c' + (a.id === activeId ? ' active' : '');
    const st = a.status || 'inbox', render = a.ai && a.ai.render;
    el.innerHTML = `<div><span class="t">${a.id} · ${fmt(a.t)} · ${t('frameN', a.frame)}</span><span class="st ${st}">${t('st')[st] || st}</span></div>
      <div class="txt"><b></b> <span class="hint"></span></div><div class="nt hint"></div>
      ${render ? `<div class="pair"><figure><figcaption>${t('crop')}</figcaption><img src="${aimg(a.crop)}"></figure><figure><figcaption>${t('aiRender')}</figcaption><img src="${aimg(render)}"></figure></div>`
               : `<img loading="lazy" src="${aimg(a.crop)}" style="background:#000;object-fit:contain;max-height:180px">`}
      <div class="verdict"></div>
      <div class="ops">${render && st !== 'approved' ? `<button data-a="pass">${t('pass')}</button><button data-a="fail">${t('fail')}</button>` : ''}<span style="flex:1"></span><button data-a="edit">${t('edit')}</button><button data-a="del">${t('del')}</button></div>`;
    el.querySelector('.txt b').textContent = a.name || '—';
    el.querySelector('.txt .hint').textContent = t('cats')[a.cat] || a.cat || '';
    el.querySelector('.nt').textContent = a.note || '';
    const vd = a.verdict ? `${a.verdict.ok ? '✓' : '✗'} ${a.verdict.text || ''}` : '';
    el.querySelector('.verdict').textContent = [a.ai && a.ai.note, vd].filter(Boolean).join('\n');
    el.querySelector('.t').onclick = () => jumpToAsset(a);
    el.querySelectorAll('img').forEach(i => i.onclick = () => jumpToAsset(a));
    const judge = async (ok, text) => { assetsInfo = await api('/api/asset/verdict', { video: cur, id: a.id, ok, text }); assets = assetsInfo.assets; renderList(); };
    el.querySelector('[data-a=pass]')?.addEventListener('click', () => judge(true, ''));
    el.querySelector('[data-a=fail]')?.addEventListener('click', () => { const why = prompt(t('failWhy'), ''); if (why !== null) judge(false, why.trim()); });
    el.querySelector('[data-a=edit]').onclick = () => startCollect(a);
    el.querySelector('[data-a=del]').onclick = async () => {
      if (!confirm(t('confirmDelA', a.id))) return;
      assetsInfo = await api('/api/asset/delete', { video: cur, id: a.id }); assets = assetsInfo.assets;
      renderList(); renderMarkers(); bumpAssets();
    };
    box.appendChild(el);
  });
}
// the AI writes back into assets.json while the tool is open; pick that up when the window comes back
addEventListener('focus', async () => { if (cur && !collecting) { await loadAssets(); if (tab === 'assets') renderList(); renderMarkers(); } });

// ---------- keyboard ----------
addEventListener('keydown', e => {
  const typing = ['TEXTAREA', 'INPUT', 'SELECT'].includes(document.activeElement.tagName);
  if (collecting) {
    if (e.key === 'Escape') { e.preventDefault(); cancelCollect(); }
    else if (e.key === 'Enter' && (e.metaKey || e.ctrlKey)) { e.preventDefault(); saveCollect(); }
    return;
  }
  if (composing) {
    if (e.key === 'Escape') { e.preventDefault(); cancelCompose(); }
    else if (e.key === 'Enter' && (e.metaKey || e.ctrlKey)) { e.preventDefault(); saveCompose(); }
    else if ((e.metaKey || e.ctrlKey) && e.key === 'z' && !typing) { e.preventDefault(); $('#undo').click(); }
    return;
  }
  if (typing) return;
  if (e.key === ' ') { e.preventDefault(); togglePlay(); }
  else if (e.key === 'ArrowRight') { e.preventDefault(); e.shiftKey ? stepFrames(1) : seek(v.currentTime + 1); }
  else if (e.key === 'ArrowLeft') { e.preventDefault(); e.shiftKey ? stepFrames(-1) : seek(v.currentTime - 1); }
  else if (e.key === '.') { e.preventDefault(); stepFrames(1); }
  else if (e.key === ',') { e.preventDefault(); stepFrames(-1); }
  else if (e.key === 'g' || e.key === 'G') { e.preventDefault(); v.pause(); $('#frameIn').focus(); $('#frameIn').select(); }
  else if (e.key === 'c' || e.key === 'C' || e.key === 'Enter') { e.preventDefault(); startCompose(); }
  else if (e.key === 'a' || e.key === 'A') { e.preventDefault(); startCollect(); }
  else if (e.key === ']' || e.key === '[') {
    const s = v.currentTime, dir = e.key === ']' ? 1 : -1;
    const list = dir > 0 ? comments.filter(c => c.time > s + 1e-3) : comments.filter(c => c.time < s - 1e-3).reverse();
    if (list[0]) jumpTo(list[0]);
  }
});
$('#frameIn').addEventListener('keydown', e => {
  e.stopPropagation();
  if (e.key === 'Enter') {
    const f = parseInt($('#frameIn').value, 10);
    if (!isNaN(f) && cur) { v.pause(); seek((Math.max(0, f) + 0.5) / fps()); }
    $('#frameIn').blur();
  } else if (e.key === 'Escape') $('#frameIn').blur();
});

applyLang();
loadVideos().then(() => {
  // deep links: #v=<path>&t=<seconds>   ·   #v=<path>&note=<n> (jump to a note)   ·   add &edit=1 to open it
  const h = new URLSearchParams(location.hash.slice(1));
  if (!h.get('v')) return;
  openVideo(h.get('v'), h.get('t') != null ? parseFloat(h.get('t')) : null).then(() => {
    const n = h.get('note'); if (!n) return;
    const c = comments.find(x => parseInt(x.id, 10) === parseInt(n, 10)); if (!c) return;
    v.addEventListener('loadedmetadata', () => h.get('edit') ? startCompose(c) : jumpTo(c), { once: true });
  });
});
</script>
</body>
</html>
